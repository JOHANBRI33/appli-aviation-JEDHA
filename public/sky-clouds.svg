<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" fill="none">
  <!-- Nuages du fond ciel Flight Hunter (le dégradé bleu est dans app/globals.css).
       Chaque nuage : une ombre bleutée décalée de 6 px, puis la forme blanche. -->
  <defs>
    <g id="cloud">
      <rect x="0" y="35" width="200" height="35" rx="32"/>
      <circle cx="48" cy="40" r="24"/>
      <circle cx="90" cy="27" r="33"/>
      <circle cx="136" cy="35" r="26"/>
      <circle cx="168" cy="48" r="17"/>
    </g>
  </defs>
  <g opacity="0.95" transform="translate(-50 64)">
    <use href="#cloud" fill="#b7d2f5" fill-opacity="0.5" y="6"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
  <g opacity="0.9" transform="translate(250 150) scale(0.75)">
    <use href="#cloud" fill="#b7d2f5" fill-opacity="0.5" y="8"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
  <g opacity="0.7" transform="translate(150 300) scale(1.15)">
    <use href="#cloud" fill="#b7d2f5" fill-opacity="0.5" y="5"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
  <g opacity="0.5" transform="translate(-30 440) scale(0.65)">
    <use href="#cloud" fill="#b7d2f5" fill-opacity="0.5" y="9"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
  <g opacity="0.35" transform="translate(280 560) scale(0.6)">
    <use href="#cloud" fill="#b7d2f5" fill-opacity="0.5" y="10"/>
    <use href="#cloud" fill="#ffffff"/>
  </g>
</svg>
